[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-group-monitor"
version = "1.0.0"
description = "Thu thap va giam sat thong tin cong khai tu cac hoi nhom Facebook"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=4.9.0,<6.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "tenacity>=8.2.0,<10.0.0",
    "pandas>=2.1.0,<3.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "streamlit>=1.28.0,<2.0.0",
    "PyYAML>=6.0.1,<7.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0,<10.0.0"]

[tool.setuptools]
packages = ["scraper"]

[tool.pytest.ini_options]
# -q: it cong don
# testpaths: chi lay file test_*.py o thu muc goc
# -p no:cacheprovider: tranh tao .pytest_cache
python_files = ["test_*.py"]
testpaths = ["."]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
